name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  # After tests pass on main, rebuild larsewallin.com so it picks up the new version.
  # Needs the repository secret VERCEL_DEPLOY_HOOK (a Vercel deploy hook URL). Skipped when it is not set,
  # so forks and other users of this repo are not affected.
  deploy-website:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Website deploy triggered."
