name: Places explore (one-off)
on:
  push:
    branches: [places-pilot]
    paths: [scripts/places/explore.sql, .github/workflows/places-explore.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install DuckDB
        run: |
          curl -sSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.4.1/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip && chmod +x duckdb && ./duckdb --version
      - name: Latest Overture release
        run: |
          REL=$(curl -s https://stac.overturemaps.org/catalog.json | python3 -c "import json,sys; c=json.load(sys.stdin); print(c.get('latest') or [l['href'] for l in c['links'] if l.get('rel')=='child'][-1].split('/')[1])")
          echo "OVERTURE_RELEASE=$REL" >> "$GITHUB_ENV"; echo "release $REL"
      - name: Explore
        run: ./duckdb -c ".read scripts/places/explore.sql"
